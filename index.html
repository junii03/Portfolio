<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, Open Graph, Twitter, JSON-LD: generated from
         src/constants by vite-plugins/seo.js at build time. -->
    <!--seo:head-->

    <!-- Icons & manifest -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Critical fonts (the 3D model is intentionally NOT preloaded: it loads lazily after first paint) -->
    <link rel="preload" href="/fonts/amiamie/woff2/Amiamie-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/amiamie/woff2/Amiamie-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <style>
        /* Prerendered content for crawlers/no-JS: hidden visually, replaced by React on mount. */
        .seo-snapshot {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }
    </style>
    <noscript>
        <style>
            .seo-snapshot {
                position: static;
                width: auto;
                height: auto;
                overflow: visible;
                clip-path: none;
                white-space: normal;
                max-width: 52rem;
                margin: 0 auto;
                padding: 2rem 1.25rem;
                font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            }
            .seo-snapshot img { max-width: 240px; height: auto; border-radius: 16px; }
            .seo-snapshot nav a { margin-right: 1rem; }
        </style>
    </noscript>
</head>

<body>
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
